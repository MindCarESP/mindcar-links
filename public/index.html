<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindCar — Tu primera historia | Buscador de coches</title>

  <meta
    name="description"
    content="La app creada por y para los amantes del motor. Porque los coches no son de segunda mano: son tu primera historia. Estamos construyendo el buscador más funcional para comprar y vender coches."
  />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:title" content="MindCar — Tu primera historia" />
  <meta
    property="og:description"
    content="Estamos construyendo el buscador más funcional para comprar y vender coches: rápido, claro y útil."
  />
  <meta property="og:image" content="/logo-full.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/logo_sf_.svg" sizes="any" />

  <style>
    :root {
      --surface: rgba(255, 255, 255, 0.06);
      --stroke: rgba(255, 255, 255, 0.10);
      --stroke-strong: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --text-soft: #cbd5e1;
      --primary: #10b981;
      --primary-strong: #059669;
      --primary-soft: rgba(16, 185, 129, 0.12);
      --radius-lg: 22px;
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.38);
      --shadow-md: 0 14px 34px rgba(0, 0, 0, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Inter, Poppins, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(16, 185, 129, 0.10), transparent 28%),
        linear-gradient(180deg, #0b1220 0%, #0f172a 48%, #0b1220 100%);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .shell {
      width: 100%;
      max-width: 760px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--stroke);
      border-radius: 32px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .topbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
    }

    .grabber {
      width: 44px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 auto;
    }

    .content {
      padding: clamp(18px, 3vw, 28px);
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: clamp(20px, 3vw, 30px);
    }

    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .logo-full {
      width: min(290px, 78%);
      display: block;
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.28));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #d1fae5;
      border: 1px solid rgba(16, 185, 129, 0.22);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(28px, 4.5vw, 42px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .accent {
      color: var(--primary);
    }

    .lead {
      max-width: 620px;
      margin: 16px auto 0;
      text-align: center;
      font-size: clamp(16px, 2vw, 18px);
      color: var(--text-soft);
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-primary,
    .btn-secondary {
      appearance: none;
      outline: none;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      padding: 0 24px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.01em;
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .btn-primary {
      border: none;
      background: var(--primary);
      color: white;
      box-shadow: 0 10px 22px rgba(16, 185, 129, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-strong);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(16, 185, 129, 0.28);
    }

    .btn-secondary {
      border: 1px solid var(--stroke-strong);
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
    }

    .btn-secondary:hover {
      transform: translateY(-1px);
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(255, 255, 255, 0.12);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 18px 4px 2px;
      color: #94a3b8;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .page {
        padding: 10px;
      }

      .shell {
        border-radius: 24px;
      }

      .content {
        padding: 14px;
      }

      .hero-card {
        padding: 18px 16px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .btn-primary,
      .btn-secondary {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="shell" aria-label="Presentación de MindCar">
      <div class="topbar">
        <div class="grabber" aria-hidden="true"></div>
      </div>

      <div class="content">
        <section class="hero-card">
          <div class="brand-lockup">
            <div class="logo-wrap">
              <img
                src="/logo-full-app.svg"
                alt="MindCar logo"
                class="logo-full"
              />
            </div>

            <div class="badge">⚙️ Proyecto en desarrollo</div>
          </div>

          <h1>
            Porque los coches no son “de segunda mano”,
            <span class="accent">son tu primera historia</span>
          </h1>

          <p class="lead">
            Estamos construyendo el <strong>buscador más funcional</strong> para comprar y vender coches:
            rápido, claro y útil.
          </p>

          <div class="hero-actions">
            <a
              class="btn-primary"
              href="https://paypal.me/MindCar"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Apoyar el desarrollo de MindCar con una donación en PayPal"
            >
              Apoyar MindCar
            </a>

            <a
              class="btn-secondary"
              href="https://github.com/TU_USUARIO/TU_REPO_APP/releases/download/testing-latest/mindcar-android.apk"
              aria-label="Descargar APK de MindCar para Android"
            >
              Descargar APK
            </a>
          </div>
        </section>

        <footer class="footer">
          <div>© <span id="y"></span> MindCar</div>

          <a href="mailto:mindcar@mindcar.es" aria-label="Enviar correo electrónico a MindCar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"/>
            </svg>
            mindcar@mindcar.es
          </a>
        </footer>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
