<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindCar — Tu primera historia | Buscador de coches</title>

  <meta
    name="description"
    content="La app creada por y para los amantes del motor. Porque los coches no son de segunda mano: son tu primera historia. Estamos construyendo el buscador más funcional para comprar y vender coches."
  />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:title" content="MindCar — Tu primera historia" />
  <meta
    property="og:description"
    content="Estamos construyendo el buscador más funcional para comprar y vender coches: rápido, claro y útil."
  />
  <meta property="og:image" content="/logo-full.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/logo_sf_.svg" sizes="any" />

  <style>
    :root {
      --bg-top: #0b1220;
      --bg-mid: #0f172a;
      --bg-bottom: #09111f;

      --surface: rgba(255, 255, 255, 0.06);
      --surface-strong: rgba(15, 23, 42, 0.84);
      --stroke: rgba(255, 255, 255, 0.10);
      --stroke-strong: rgba(255, 255, 255, 0.14);

      --text: #f8fafc;
      --text-soft: rgba(248, 250, 252, 0.78);
      --text-muted: rgba(248, 250, 252, 0.55);

      --primary: #10b981;
      --primary-strong: #059669;
      --primary-soft: rgba(16, 185, 129, 0.12);
      --primary-pill: #d1fae5;

      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.42);
      --shadow-md: 0 16px 34px rgba(0, 0, 0, 0.30);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Inter, Poppins, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(16, 185, 129, 0.12), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(255, 255, 255, 0.05), transparent 18%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      isolation: isolate;
    }

    .glow {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(16px);
      z-index: -1;
    }

    .glow-1 {
      width: 260px;
      height: 260px;
      top: -40px;
      left: -60px;
      background: rgba(16, 185, 129, 0.18);
      box-shadow: 0 0 120px 40px rgba(16, 185, 129, 0.16);
    }

    .glow-2 {
      width: 220px;
      height: 220px;
      top: 120px;
      right: -80px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 120px 30px rgba(255, 255, 255, 0.04);
    }

    .content {
      width: 100%;
      max-width: 620px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      background: var(--surface-strong);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: clamp(20px, 3vw, 30px);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.035) 0%,
        rgba(255, 255, 255, 0) 26%
      );
      pointer-events: none;
    }

    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .logo-shell {
      width: min(320px, 82%);
      padding: 18px 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-full {
      width: 100%;
      max-width: 250px;
      display: block;
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.28));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-pill);
      border: 1px solid rgba(16, 185, 129, 0.20);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(30px, 4.8vw, 42px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .accent {
      color: var(--primary);
    }

    .lead {
      max-width: 560px;
      margin: 16px auto 0;
      text-align: center;
      font-size: clamp(16px, 2vw, 18px);
      color: var(--text-soft);
    }

    .lead strong {
      color: var(--text);
      font-weight: 800;
    }

    .hero-actions {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .btn-primary,
    .btn-secondary {
      appearance: none;
      border: 0;
      outline: none;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 0 22px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.01em;
      transition:
        transform 0.16s ease,
        background 0.16s ease,
        box-shadow 0.16s ease,
        border-color 0.16s ease,
        opacity 0.16s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(16, 185, 129, 0.24);
    }

    .btn-primary:hover {
      background: var(--primary-strong);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(16, 185, 129, 0.28);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border: 1px solid var(--stroke-strong);
      box-shadow: var(--shadow-md);
    }

    .btn-secondary:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(16, 185, 129, 0.30);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 18px 4px 2px;
      color: var(--text-muted);
      font-size: 14px;
      flex-wrap: wrap;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .footer a:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .footer svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
      }

      .hero-card {
        border-radius: 24px;
        padding: 18px 16px;
      }

      .logo-shell {
        width: 100%;
        padding: 16px 12px;
        border-radius: 18px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>

    <div class="content">
      <section class="hero-card" aria-label="Presentación de MindCar">
        <div class="brand-lockup">
          <div class="logo-wrap">
            <div class="logo-shell">
              <img
                src="/logo-full-app.svg"
                alt="Logo de MindCar"
                class="logo-full"
              />
            </div>
          </div>

          <div class="badge">⚙️ Proyecto en desarrollo</div>
        </div>

        <h1>
          Porque los coches no son “de segunda mano”,
          <span class="accent">son tu primera historia</span>
        </h1>

        <p class="lead">
          Estamos construyendo el <strong>buscador más funcional</strong> para comprar y vender coches:
          rápido, claro y útil.
        </p>

        <div class="hero-actions">
          <a
            class="btn-primary"
            href="https://paypal.me/MindCar"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Apoyar el desarrollo de MindCar con una donación en PayPal"
          >
            Apoyar MindCar
          </a>

          <a
            class="btn-secondary"
            href="https://github.com/MindCarESP/MindCarFlutter/releases/download/testing-latest/mindcar-testing.apk"
            aria-label="Descargar APK de MindCar para Android"
          >
            Descargar APK
          </a>
        </div>
      </section>

      <footer class="footer">
        <div>© <span id="y"></span> MindCar</div>

        <a href="mailto:mindcar@mindcar.es" aria-label="Enviar correo electrónico a MindCar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"/>
          </svg>
          mindcar@mindcar.es
        </a>
      </footer>
    </div>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
